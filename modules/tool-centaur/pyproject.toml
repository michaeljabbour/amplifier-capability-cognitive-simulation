[project]
name = "amplifier-module-tool-centaur"
version = "0.1.0"
description = "Centaur human cognition prediction tool for Amplifier"
requires-python = ">=3.11"
license = { text = "MIT" }
# Only declare dependencies needed by ALL backends.
# torch, transformers, unsloth are NOT listed -- they are environment-specific
# and must be pre-installed when using the local_gpu backend.
# amplifier-core is NOT listed -- it is a peer dependency provided by the host.
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[project.entry-points."amplifier.modules"]
tool-centaur = "amplifier_module_tool_centaur:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_centaur"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests/tool-centaur"]
