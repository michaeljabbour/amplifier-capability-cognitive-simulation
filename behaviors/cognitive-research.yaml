bundle:
  name: cognitive-research-behavior
  version: 0.1.0
  description: Centaur human cognition prediction tool with expert simulation agent

tools:
  - module: tool-centaur
    source: git+https://github.com/michaeljabbour/amplifier-centaur@main#subdirectory=modules/tool-centaur
    config:
      backend:
        type: rest_api
        api_url: http://localhost:8000
        api_key_env: HF_TOKEN
        model_name: marcelbinz/Llama-3.1-Centaur-70B
        timeout: 120
      max_tokens: 16

agents:
  include:
    - cognitive-research:cognition-simulator

context:
  include:
    - cognitive-research:context/cognitive-research-instructions.md
